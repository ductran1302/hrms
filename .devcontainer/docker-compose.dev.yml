services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: hrms-dev:latest
    container_name: hrms-dev
    entrypoint: ["/bin/sh", "-c", "sudo chown -R vscode:vscode /home/vscode/.m2 && exec sleep infinity"]
    init: true
    ports:
      - "5173:5173"   # Vite dev server → host browser (VS Code forwardPorts cũng đã có 5173)
    volumes:
      - ..:/workspaces/HRMS:cached
      - maven_cache:/home/vscode/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -Dmaven.repo.local=/home/vscode/.m2/repository
    # Nạp secret từ .env gốc repo (docker-compose.yml/application.yml đã fail-fast `:?`,
    # không còn default) — jar identity chạy trong container đọc được biến khi start.
    env_file:
      - path: ../.env
        required: false
    networks:
      - default

volumes:
  maven_cache:
    name: hrms_maven_cache

networks:
  default:
    name: hrms_default
