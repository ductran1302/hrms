# App stack production-style — cần hạ tầng (docker-compose.yml) đã chạy trước.
#   docker compose -f docker-compose.app.yml up -d --build
# Join network hrms_default chung (postgres, kafka, schema-registry, keycloak, zipkin).
name: hrms-app

services:
  identity:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    restart: unless-stopped
    environment:
      DOCS_DIR: /app/data/documents
      # Fail-fast: secret lấy từ .env (không còn default trong git)
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chưa được set — copy .env.example thành .env}
      # Mật khẩu mặc định NV mới = <username><suffix> (vd thduc1@hrms)
      HRMS_PASSWORD_SUFFIX: ${HRMS_PASSWORD_SUFFIX:-@hrms}
      HRMS_IDENTITY_CLIENT_SECRET: ${HRMS_IDENTITY_CLIENT_SECRET:?HRMS_IDENTITY_CLIENT_SECRET chưa được set — copy .env.example thành .env}
      # Tắt Swagger ngoài dev (SecurityConfig vẫn permitAll nhưng springdoc trả 404)
      SPRINGDOC_API_DOCS: ${SPRINGDOC_API_DOCS:-false}
      SPRINGDOC_UI: ${SPRINGDOC_UI:-false}
    volumes:
      - hrms-documents:/app/data/documents

  attendance:
    build:
      context: .
      dockerfile: attendance-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD chưa được set — copy .env.example thành .env}
      SPRINGDOC_API_DOCS: ${SPRINGDOC_API_DOCS:-false}
      SPRINGDOC_UI: ${SPRINGDOC_UI:-false}

  gateway:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      IDENTITY_URI: http://identity:8080
      ATTENDANCE_URI: http://attendance:8080
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-600}
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - attendance

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # rỗng → axios gọi relative /api/** → nginx proxy sang gateway (same-origin, không CORS)
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  hrms-documents:

networks:
  default:
    name: hrms_default
    external: true
