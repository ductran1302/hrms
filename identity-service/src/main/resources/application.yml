server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/identity_db
    username: ${DB_USER:hrms}
    password: ${DB_PASSWORD:hrms_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    properties:
      # Client URL in-network (SCHEMA_REGISTRY_ADVERTISED chỉ dành cho host)
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/realms/hrms/protocol/openid-connect/certs}

hrms:
  keycloak:
    # Issuer cố định trong token (Keycloak cấu hình KC_HOSTNAME=http://localhost:8081)
    issuer: ${ISSUER_URI:http://localhost:8081/realms/hrms}
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 5

logging:
  pattern:
    correlation: "[identity-service,%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "

management:
  zipkin:
    tracing:
      # in-network (default của Boot là localhost:9411 — không tới được từ container)
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
