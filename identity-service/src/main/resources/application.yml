server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/identity_db
    username: ${DB_USER:hrms}
    # Fail-fast: secret lấy từ env (.env khi dev) — không còn default trong git
    password: ${DB_PASSWORD:?DB_PASSWORD chưa được set — copy .env.example thành .env (devcontainer/app stack tự nạp)}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    properties:
      # Client URL in-network (SCHEMA_REGISTRY_ADVERTISED chỉ dành cho host)
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/realms/hrms/protocol/openid-connect/certs}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

hrms:
  keycloak:
    # Issuer cố định trong token (Keycloak cấu hình KC_HOSTNAME=http://localhost:8181)
    issuer: ${ISSUER_URI:http://localhost:8181/realms/hrms}
    # Audience bắt buộc trong claim "aud" của token — phải khớp audience mapper
    # "hrms-api" gắn trên client hrms-spa (keycloak/realm-hrms.json)
    audience: ${JWT_AUDIENCE:hrms-api}
    admin:
      # Admin API: tạo/tắt user khi tạo/nghỉ việc (mã NV = username đăng nhập).
      # Thay password-grant admin-cli bằng client_credentials qua client
      # "hrms-identity" (service account, realm-management) — không giữ
      # master admin password trong service nữa.
      base-url: ${KEYCLOAK_ADMIN_URL:http://keycloak:8080}
      realm: ${KEYCLOAK_REALM:hrms}
      client-id: ${HRMS_IDENTITY_CLIENT_ID:hrms-identity}
      # PHẢI khớp "secret" của client hrms-identity trong keycloak/realm-hrms.json
      client-secret: ${HRMS_IDENTITY_CLIENT_SECRET:?HRMS_IDENTITY_CLIENT_SECRET chưa được set — copy .env.example thành .env}
      # Mật khẩu mặc định khi tạo tài khoản = <username><suffix> (vd thduc1@hrms)
      password-suffix: ${HRMS_PASSWORD_SUFFIX:@hrms}
      # Client dùng password-grant để tự xác thực mật khẩu khi đổi mật khẩu
      spa-client-id: ${HRMS_SPA_CLIENT_ID:hrms-spa}
    sync:
      # Scheduler poll task PENDING (fallback sau crash / Keycloak tạm lỗi)
      poll-ms: ${KEYCLOAK_SYNC_POLL_MS:5000}
      initial-delay-ms: ${KEYCLOAK_SYNC_INITIAL_DELAY_MS:10000}
      # Dọn task DONE cũ hơn N ngày (0 = tắt); chạy theo cron hằng ngày
      retention-days: ${KEYCLOAK_SYNC_RETENTION_DAYS:30}
      cleanup-cron: "${KEYCLOAK_SYNC_CLEANUP_CRON:0 30 3 * * *}"
  storage:
    # Thư mục lưu tài liệu đính kèm (relative tới working dir nếu không phải absolute)
    documents-dir: ${DOCS_DIR:data/documents}
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-attempts: 5

logging:
  pattern:
    correlation: "[identity-service,%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "

# Swagger: chỉ mở ở dev — app stack đặt SPRINGDOC_API_DOCS/UI=false (xem docker-compose.app.yml)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS:true}
  swagger-ui:
    enabled: ${SPRINGDOC_UI:true}

management:
  zipkin:
    tracing:
      # in-network (default của Boot là localhost:9411 — không tới được từ container)
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
