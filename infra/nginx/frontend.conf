server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ==== Security headers (SPA là document → CSP áp dụng tại đây) ====
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: app cùng origin; Keycloak (8081) cần cho token/refresh + iframe SSO.
  # Production đổi origin Keycloak theo domain thật (ngoài localhost).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8081; frame-src http://localhost:8081;" always;

  # SPA gọi API cùng-origin → không cần CORS (rewrite path giữ nguyên /api/v1/...)
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA routing: mọi route chưa tồn tại → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
