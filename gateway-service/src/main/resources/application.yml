server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://keycloak:8080/realms/hrms/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: identity-employees
          # Default = dev (identity jar trong hrms-dev, SERVER_PORT=8183);
          # app stack override qua env IDENTITY_URI=http://identity:8080
          uri: ${IDENTITY_URI:http://localhost:8183}
          predicates:
            - Path=/api/v1/employees/**
        - id: attendance-employees
          # Default = dev (attendance jar, SERVER_PORT=8186); app stack override qua env
          uri: ${ATTENDANCE_URI:http://localhost:8186}
          predicates:
            - Path=/api/v1/attendance/**
        # Các API identity còn lại (departments/contracts/history/org-chart/...) —
        # phải đặt SAU route attendance để /api/v1/attendance/** không rơi vào đây.
        - id: identity-api
          uri: ${IDENTITY_URI:http://localhost:8183}
          predicates:
            - Path=/api/v1/**
      # CORS khai báo trong SecurityConfig (Security filter chain chạy trước gateway)

hrms:
  keycloak:
    # Phải khớp issuer trong token (Keycloak KC_HOSTNAME=http://localhost:8181)
    issuer: ${ISSUER_URI:http://localhost:8181/realms/hrms}
    # Audience bắt buộc trong claim "aud" của token — phải khớp audience mapper
    # "hrms-api" gắn trên client hrms-spa (keycloak/realm-hrms.json)
    audience: ${JWT_AUDIENCE:hrms-api}
  # Rate limit tại gateway (per username, fallback IP; cửa sổ 60s, in-memory).
  # Multi-instance → phải thay bằng Redis/Bucket4j phân tán.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

logging:
  pattern:
    correlation: "[gateway-service,%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
